name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/annotator-webapp/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install annotator-webapp dependencies
        working-directory: apps/annotator-webapp
        run: npm ci

      - name: Typecheck
        working-directory: apps/annotator-webapp
        run: npm run typecheck

      - name: ESLint
        working-directory: apps/annotator-webapp
        run: npm run lint

      - name: Prettier check
        working-directory: apps/annotator-webapp
        run: npm run format:check

      - name: Stylelint
        working-directory: apps/annotator-webapp
        run: npm run lint:css

      - name: Tests
        working-directory: apps/annotator-webapp
        run: npm run test -- --reporter=verbose
